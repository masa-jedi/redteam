title: PHP memory-limit exhaustion during request parsing
id: 0f6a9c1e-3b2d-4a77-9e51-7c1d2a5b8e44
status: experimental
description: >
  A PHP worker reports that the memory limit was exhausted while parsing a
  request. On the Task 001 lab this fires for the multipart OOM producer and the
  final forged-cleanup request. It is a signal, not a verdict: correlate it with
  a burst of POSTs and an anomalous PHPSESSID length before escalating.
references:
  - https://github.com/KillaBoi/StealMyBitcoin-PoC
author: task-001
date: 2026/10/26
logsource:
  product: php
  service: error
detection:
  selection:
    message|contains|all:
      - "Allowed memory size"
      - "exhausted"
  condition: selection
falsepositives:
  - a legitimate large upload with a low memory_limit
  - an application that parses untrusted deep JSON or multipart input
level: medium
tags:
  - attack.t1190
  - attack.t1499
